<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Ujian - EduLearn</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .bg-brand-gradient { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
        .sidebar-item-active { background-color: #eff6ff; color: #4f46e5; font-weight: 600; }
        .sidebar-item { color: #64748b; font-weight: 500; transition: all 0.2s; }
        .sidebar-item:hover { color: #4f46e5; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-slate-800">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col justify-between flex-shrink-0 z-20">
        <div class="overflow-y-auto">
            <div class="bg-brand-gradient p-6 text-white rounded-br-2xl">
                <div class="flex items-center space-x-3">
                    <div class="bg-white/20 p-2 rounded-lg backdrop-blur-sm"><i class="fa-solid fa-graduation-cap text-xl"></i></div>
                    <div>
                        <h1 class="text-lg font-bold tracking-wide">EduLearn</h1>
                        <p class="text-xs text-indigo-100 uppercase tracking-wider mt-0.5">Sistem Pembelajaran</p>
                    </div>
                </div>
            </div>

            <div class="px-4 py-6 text-sm">
                <a href="dashboard.html" class="flex items-center space-x-3 px-4 py-2.5 sidebar-item rounded-lg mb-6">
                    <i class="fa-solid fa-house w-5 text-center"></i><span>Dashboard</span>
                </a>

                <p class="px-4 text-xs font-bold text-slate-400 mb-3 uppercase tracking-wider">Menu Utama</p>
                <nav class="space-y-1 mb-8">
                    <a href="matakuliah.html" class="flex items-center space-x-3 px-4 py-2.5 sidebar-item rounded-lg"><i class="fa-solid fa-book w-5 text-center"></i><span>Mata Kuliah</span></a>
                    <a href="tugas.html" class="flex items-center space-x-3 px-4 py-2.5 sidebar-item rounded-lg"><i class="fa-solid fa-file-pen w-5 text-center"></i><span>Tugas</span></a>
                    <!-- Menu Ujian Aktif -->
                    <a href="ujian.html" class="flex items-center space-x-3 px-4 py-3 sidebar-item-active rounded-xl"><i class="fa-regular fa-file-lines w-5 text-center"></i><span>Ujian</span></a>
                    <a href="absensi.html" class="flex items-center space-x-3 px-4 py-2.5 sidebar-item rounded-lg"><i class="fa-solid fa-user-check w-5 text-center"></i><span>Absensi</span></a>
                    <a href="nilai.html" class="flex items-center space-x-3 px-4 py-2.5 sidebar-item rounded-lg"><i class="fa-solid fa-chart-simple w-5 text-center"></i><span>Nilai</span></a>
                    <a href="pengumuman.html" class="flex items-center space-x-3 px-4 py-2.5 sidebar-item rounded-lg"><i class="fa-solid fa-bullhorn w-5 text-center"></i><span>Pengumuman</span></a>
                </nav>

                <p class="px-4 text-xs font-bold text-slate-400 mb-3 uppercase tracking-wider">Akun</p>
                <nav class="space-y-1">
                    <a href="profil.html" class="flex items-center space-x-3 px-4 py-2.5 sidebar-item rounded-lg"><i class="fa-regular fa-user w-5 text-center"></i><span>Profil Saya</span></a>
                    <a href="pengaturan.html" class="flex items-center space-x-3 px-4 py-2.5 sidebar-item rounded-lg"><i class="fa-solid fa-gear w-5 text-center"></i><span>Pengaturan</span></a>
                </nav>
            </div>
        </div>

        <div class="p-4 border-t border-slate-100">
            <button id="btnLogout" class="w-full flex items-center justify-center space-x-2 px-4 py-2.5 border border-red-200 text-red-500 hover:bg-red-50 rounded-lg transition-colors font-medium text-sm mb-3">
                <i class="fa-solid fa-arrow-right-from-bracket"></i><span>Keluar</span>
            </button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 overflow-y-auto flex flex-col bg-slate-50">
        <header class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center sticky top-0 z-10 shadow-sm">
            <h2 class="text-lg font-bold text-slate-800">Daftar Ujian Aktif</h2>
            <div class="flex items-center space-x-6">
                <div class="flex items-center space-x-3 border-l border-slate-200 pl-6 cursor-pointer">
                    <img src="https://ui-avatars.com/api/?name=Andi+P&background=e0e7ff&color=4f46e5" alt="Avatar" class="w-10 h-10 rounded-full border border-slate-200">
                    <div class="hidden md:block leading-tight">
                        <p class="text-sm font-bold text-slate-800" id="userNameDisplay">Memuat...</p>
                        <p class="text-xs text-slate-500 mt-0.5">Mahasiswa</p>
                    </div>
                </div>
            </div>
        </header>

        <!-- Content Area -->
        <div class="p-8">
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-slate-800">Ujian yang Tersedia</h2>
                <p class="text-sm text-slate-500 mt-1">Pilih ujian di bawah ini untuk mulai mengerjakan soal.</p>
            </div>

            <!-- Grid Container Daftar Ujian -->
            <div id="containerDaftarUjian" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Animasi Loading -->
                <div class="bg-white p-6 rounded-2xl border border-slate-100 animate-pulse h-48">
                    <div class="h-4 bg-slate-200 rounded w-1/4 mb-4"></div>
                    <div class="h-6 bg-slate-200 rounded w-3/4 mb-3"></div>
                    <div class="h-4 bg-slate-200 rounded w-1/2"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/config.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const sessionData = localStorage.getItem('user_session');
            if (!sessionData) { window.location.href = '../login.html'; return; }
            
            const user = JSON.parse(sessionData);
            document.getElementById('userNameDisplay').innerText = user.username.split('@')[0];

            document.getElementById('btnLogout').addEventListener('click', () => {
                localStorage.removeItem('user_session');
                window.location.href = '../login.html';
            });

            await loadDaftarUjian(user.id_user);
        });

        async function loadDaftarUjian(id_user) {
            const container = document.getElementById('containerDaftarUjian');
            try {
                const response = await fetch(CONFIG.API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'get_ujian', id_mahasiswa: id_user })
                });
                const result = await response.json();

                if (result.status === 'success') {
                    container.innerHTML = '';
                    if (result.data.length === 0) {
                        container.innerHTML = '<p class="text-slate-500 col-span-full text-center py-10">Belum ada jadwal ujian saat ini.</p>';
                        return;
                    }

                    result.data.forEach(u => {
                        const card = document.createElement('div');
                        card.className = "bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition flex flex-col justify-between";
                        card.innerHTML = `
                            <div>
                                <div class="flex justify-between items-start mb-3">
                                    <span class="bg-red-50 text-red-600 text-xs font-bold px-2.5 py-1 rounded-md border border-red-100">UJIAN</span>
                                    <span class="text-xs font-bold text-slate-400">Bobot: ${u.bobot}</span>
                                </div>
                                <h3 class="text-lg font-bold text-slate-800 mb-1">${u.judul}</h3>
                                <p class="text-xs text-indigo-600 font-semibold mb-3">${u.mata_kuliah}</p>
                                <p class="text-xs text-slate-500 mb-4 line-clamp-2">${u.deskripsi}</p>
                                
                                <div class="bg-slate-50 p-3 rounded-lg border border-slate-100 text-xs text-slate-600 space-y-1">
                                    <div class="flex items-center"><i class="fa-regular fa-clock w-4 text-red-500 mr-1.5"></i> Mulai: ${u.mulai}</div>
                                    <div class="flex items-center"><i class="fa-regular fa-hourglass-end w-4 text-slate-400 mr-1.5"></i> Selesai: ${u.selesai}</div>
                                </div>
                            </div>

                            <div class="mt-6">
                                <button onclick="window.location.href='ujian_soal.html?id_ujian=${u.id_ujian}'" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl text-xs font-bold transition shadow-sm flex items-center justify-center">
                                    <i class="fa-solid fa-pen-to-square mr-2"></i> Mulai Kerjakan Ujian
                                </button>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = `<p class="text-red-500 col-span-full text-center py-10">${result.message}</p>`;
                }
            } catch (err) {
                container.innerHTML = `<p class="text-red-500 col-span-full text-center py-10">Gagal terhubung ke server.</p>`;
            }
        }
    </script>
</body>
</html>
