<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mata Kuliah - EduLearn</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-slate-800">

    <!-- TEMPAT PENAMPUNG SIDEBAR (Diisi oleh JS) -->
    <div id="sidebar-container"></div>

    <!-- MAIN CONTENT -->
    <main class="flex-1 overflow-y-auto flex flex-col">
        
        <!-- TEMPAT PENAMPUNG HEADER (Diisi oleh JS) -->
        <div id="header-container"></div>

        <!-- Content Area -->
        <div class="p-8">
            <div class="flex justify-between items-end mb-6 border-b border-slate-200 pb-4">
                <div>
                    <h2 class="text-2xl font-bold text-slate-800">Mata Kuliah Semester Ini</h2>
                    <p class="text-sm text-slate-500 mt-1">Pilih mata kuliah untuk melihat modul, materi, dan tugas.</p>
                </div>
 
                <!-- Search Bar untuk filter -->
                <div class="relative hidden md:block">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" placeholder="Cari mata kuliah..." class="pl-10 pr-4 py-2.5 border border-slate-200 rounded-lg text-sm w-72 focus:outline-none focus:border-indigo-300 focus:ring-1 focus:ring-indigo-300">
                </div>
            </div>

            <!-- Grid Kontainer Mata Kuliah -->
            <div id="containerMataKuliah" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Animasi Loading -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between animate-pulse h-48">
                    <div>
                        <div class="w-12 h-12 rounded-xl bg-slate-200 mb-4"></div>
                        <div class="h-5 bg-slate-200 rounded w-3/4 mb-2"></div>
                        <div class="h-3 bg-slate-200 rounded w-1/2"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL DETAIL PERTEMUAN (POPUP) -->
    <div id="modalDetailKelas" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden">
            <!-- Header Modal -->
            <div class="flex justify-between items-center p-5 border-b border-slate-200 bg-slate-50">
                <div>
                    <h3 class="text-lg font-bold text-slate-800" id="modalJudulKelas">Detail Kelas</h3>
                    <p class="text-sm text-slate-500">Daftar pertemuan dan akses Zoom</p>
                </div>
                <button onclick="tutupModalDetail()" class="text-slate-400 hover:text-red-500 text-2xl p-2 hover:bg-slate-100 rounded-full transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
    
            <!-- Body Modal -->
            <div id="modalContainerPertemuan" class="flex-1 overflow-y-auto p-5 bg-slate-50 space-y-3">
                <!-- Data pertemuan akan di-load oleh JS -->
                <div class="text-center py-10 text-slate-400">
                    <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2"></i>
                    <p>Memuat jadwal pertemuan...</p>
                </div>
            </div>
            
            <!-- Footer Modal -->
            <div class="p-4 border-t border-slate-200 bg-white flex justify-end">
                <button onclick="tutupModalDetail()" class="px-6 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-semibold transition-colors">
                    Tutup
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/config.js"></script>
    <script src="../js/mahasiswa-load-components.js"></script>
    <script src="../js/matakuliah.js"></script>
</body>
</html>
