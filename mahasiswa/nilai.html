<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nilai Akademik - EduLearn</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-slate-800">

    <!-- TEMPAT PENAMPUNG SIDEBAR (Diisi oleh JS) -->
    <div id="sidebar-container"></div>

    <!-- MAIN CONTENT -->
    <main class="flex-1 overflow-y-auto flex flex-col bg-slate-50">
        
        <!-- TEMPAT PENAMPUNG HEADER (Diisi oleh JS) -->
        <div id="header-container"></div>

        <!-- Content Area -->
        <div class="p-8">
            <div class="flex justify-between items-center mb-6 border-b border-slate-200 pb-4">
                <div>
                    <h2 class="text-2xl font-bold text-slate-800">Rekapitulasi Nilai Akademik</h2>
                    <p class="text-sm text-slate-500 mt-1">Berikut adalah daftar nilai komponen tugas, UTS, UAS, dan nilai akhir Anda.</p>
                </div>
                <div class="bg-white border border-slate-200 px-4 py-2 rounded-xl shadow-sm text-right">
                    <p class="text-xs text-slate-400 font-bold uppercase">Indeks Prestasi (IP)</p>
                    <p class="text-xl font-extrabold text-indigo-600" id="ipkDisplay">0.00</p>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <table class="w-full text-left text-sm text-slate-600">
                    <thead class="bg-slate-50 text-slate-800 uppercase font-bold text-xs">
                        <tr>
                            <th class="px-6 py-4">No</th>
                            <th class="px-6 py-4">Mata Kuliah</th>
                            <th class="px-6 py-4 text-center">SKS</th>
                            <th class="px-6 py-4 text-center">Tugas</th>
                            <th class="px-6 py-4 text-center">UTS</th>
                            <th class="px-6 py-4 text-center">UAS</th>
                            <th class="px-6 py-4 text-center">Kehadiran</th>
                            <th class="px-6 py-4 text-center">Akhir</th>
                            <th class="px-6 py-4 text-center">Grade</th>
                        </tr>
                    </thead>
                    <tbody id="tabelNilaiBody">
                        <tr>
                            <td colspan="9" class="text-center py-10 text-slate-400 italic">
                                <i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Memuat data nilai...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="../js/config.js"></script>
    <script src="../js/mahasiswa-load-components.js"></script>
    <script src="../js/nilai.js"></script>
</body>
</html>
