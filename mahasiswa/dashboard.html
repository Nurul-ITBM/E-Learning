<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Mahasiswa - EduLearn</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-slate-800">

    <!-- TEMPAT PENAMPUNG SIDEBAR (Diisi oleh JS) -->
    <div id="sidebar-container"></div>

    <!-- MAIN CONTENT -->
    <main class="flex-1 overflow-y-auto flex flex-col">
        
        <!-- TEMPAT PENAMPUNG HEADER (Diisi oleh JS) -->
        <div id="header-container"></div>

        <!-- Content Area -->
        <div class="p-8 space-y-6">
            
            <!-- Hero Banner -->
            <div class="bg-banner-gradient rounded-2xl p-8 flex justify-between items-center shadow-sm relative overflow-hidden">
                <div class="relative z-10">
                    <h2 class="text-2xl font-bold text-slate-800 mb-2">Selamat datang, <span id="bannerNameDisplay" class="text-indigo-700">Mahasiswa</span>! 👋</h2>
                    <p class="text-sm text-slate-600">Tetap semangat belajar dan jangan lupa menyelesaikan tugas tepat waktu.</p>
                </div>
                <div class="hidden md:flex absolute right-10 top-0 h-full items-center text-indigo-200 opacity-40 text-7xl">
                    <i class="fa-solid fa-laptop-code"></i>
                </div>
            </div>

            <!-- Stat Cards -->
            <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
                <!-- (Pertahankan kartu statistik Anda yang sudah ada di sini) -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center space-x-4">
                    <div class="w-12 h-12 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center"><i class="fa-solid fa-book-open text-xl"></i></div>
                    <div><h3 class="text-2xl font-bold text-slate-800 leading-none">5</h3><p class="text-xs text-slate-500 mt-1.5 font-medium">Mata Kuliah Aktif</p></div>
                </div>
                <!-- ... (lanjutkan statistik lainnya) ... -->
            </div>

            <!-- Grid Layout Utama (Jadwal, Tugas, dll tetap di sini) -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- ... (Kode layout utama Anda tetap sama persis) ... -->
            </div>
        </div>
    </main>

    <!-- Scripts (Urutan Penting) -->
    <script src="../js/config.js"></script>
    <script src="../js/mahasiswa-load-components.js"></script>
    
    <!-- Ganti nama file JS ini sesuai dengan logic dashboard mahasiswa Anda -->
    <script src="../js/mahasiswa-dashboard.js"></script>
</body>
</html>
