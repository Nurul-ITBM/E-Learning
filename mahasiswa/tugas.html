<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas Saya - EduLearn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-slate-800">

    <!-- TEMPAT PENAMPUNG SIDEBAR (Diisi oleh JS) -->
    <div id="sidebar-container"></div>

    <!-- MAIN CONTENT -->
    <main class="flex-1 overflow-y-auto flex flex-col">
        
        <!-- TEMPAT PENAMPUNG HEADER (Diisi oleh JS) -->
        <div id="header-container"></div>

        <!-- Content Area -->
        <div class="p-8">
            <div class="flex justify-between items-end mb-6 border-b border-slate-200 pb-4">
                <div>
                    <h2 class="text-2xl font-bold text-slate-800">Tugas Aktif</h2>
                    <p class="text-sm text-slate-500 mt-1">Selesaikan tugas sebelum tenggat waktu berakhir.</p>
                </div>
            </div>

            <!-- Grid Tugas -->
            <div id="containerTugas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Animasi Loading -->
                <div class="bg-white p-5 rounded-2xl border border-slate-100 animate-pulse h-40">
                    <div class="h-4 bg-slate-200 rounded w-1/3 mb-4"></div>
                    <div class="h-5 bg-slate-200 rounded w-3/4 mb-2"></div>
                    <div class="h-3 bg-slate-200 rounded w-1/2"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/mahasiswa-load-components.js"></script>
    <script src="../js/tugas.js"></script>
</body>
</html>
