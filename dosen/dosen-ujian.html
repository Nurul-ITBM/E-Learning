<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Ujian - EduLearn Dosen</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .bg-brand-gradient { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-slate-800">

    <!-- TEMPAT PENAMPUNG SIDEBAR -->
    <div id="sidebar-container"></div>

    <!-- MAIN CONTENT -->
    <main class="flex-1 overflow-y-auto flex flex-col">
        
        <!-- TEMPAT PENAMPUNG HEADER -->
        <div id="header-container"></div>

        <div class="p-8 space-y-6">
            <!-- Hero Banner -->
            <div class="bg-gradient-to-r from-indigo-50 to-purple-50 rounded-2xl p-8 flex justify-between items-center shadow-sm relative overflow-hidden">
                <div class="relative z-10">
                    <h2 class="text-2xl font-bold text-slate-800 mb-2">Kelola Ujian & Soal 📝</h2>
                    <p class="text-sm text-slate-600">Buat ujian, tambahkan soal, dan kelola jadwal ujian untuk setiap mata kuliah.</p>
                </div>
                <div class="hidden md:flex absolute right-10 top-0 h-full items-center text-indigo-200 opacity-50 text-7xl">
                    <i class="fa-solid fa-file-circle-question"></i>
                </div>
            </div>

            <!-- Filter & Tombol Tambah -->
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="w-full md:w-1/3">
                    <label class="block text-xs font-bold text-slate-600 mb-1">Pilih Mata Kuliah</label>
                    <select id="filterKelasUjian" class="w-full border border-slate-200 rounded-lg p-2 text-sm bg-white focus:ring-2 focus:ring-indigo-500">
                        <option value="">-- Pilih Mata Kuliah --</option>
                    </select>
                </div>
                <button id="btnTambahUjian" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-lg shadow-sm font-semibold text-sm transition flex items-center gap-2 disabled:opacity-50" disabled>
                    <i class="fa-solid fa-plus"></i> Tambah Ujian
                </button>
            </div>

            <!-- Daftar Ujian -->
            <div id="containerDaftarUjian" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <p class="text-slate-500 col-span-full text-center py-10">Silakan pilih mata kuliah di dropdown atas.</p>
            </div>
        </div>
    </main>

    <!-- Modal Tambah/Edit Ujian -->
    <div id="modalTambahUjian" class="fixed inset-0 bg-black/50 z-[60] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden">
            <div class="p-5 border-b border-slate-200 flex justify-between items-center">
                <h3 class="text-lg font-bold text-slate-800" id="modalUjianTitle">Tambah Ujian Baru</h3>
                <button onclick="tutupModal('modalTambahUjian')" class="text-slate-400 hover:text-red-500"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="formTambahUjian" class="p-5 space-y-4">
                <input type="hidden" id="ujian_id_kelas">
                <input type="hidden" id="ujian_id_ujian_edit">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Judul Ujian</label>
                    <input id="ujian_judul" type="text" class="w-full border rounded-lg p-2 text-sm" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Deskripsi</label>
                    <textarea id="ujian_deskripsi" class="w-full border rounded-lg p-2 text-sm h-24" required></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Waktu Mulai</label>
                        <input id="ujian_mulai" type="datetime-local" class="w-full border rounded-lg p-2 text-sm" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Waktu Selesai</label>
                        <input id="ujian_selesai" type="datetime-local" class="w-full border rounded-lg p-2 text-sm" required>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Bobot Nilai</label>
                    <input id="ujian_bobot" type="number" class="w-full border rounded-lg p-2 text-sm" placeholder="20" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Status</label>
                    <select id="ujian_status" class="w-full border rounded-lg p-2 text-sm">
                        <option value="Aktif">Aktif</option>
                        <option value="Draft">Draft</option>
                        <option value="Selesai">Selesai</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-lg">Simpan Ujian</button>
            </form>
        </div>
    </div>

    <!-- Modal Kelola Soal -->
    <div id="modalKelolaSoal" class="fixed inset-0 bg-black/50 z-[70] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden">
            <div class="p-5 border-b border-slate-200 flex justify-between items-center">
                <h3 class="text-lg font-bold text-slate-800" id="modalSoalTitle">Kelola Soal Ujian</h3>
                <button onclick="tutupModal('modalKelolaSoal')" class="text-slate-400 hover:text-red-500"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-5 max-h-96 overflow-y-auto">
                <div class="mb-4">
                    <button onclick="tampilkanFormTambahSoal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-bold">
                        <i class="fa-solid fa-plus mr-1"></i> Tambah Soal
                    </button>
                </div>
                <div id="containerDaftarSoal" class="space-y-4">
                    <p class="text-slate-500 text-center py-6">Belum ada soal untuk ujian ini.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Tambah/Edit Soal -->
    <div id="modalTambahSoal" class="fixed inset-0 bg-black/50 z-[80] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden">
            <div class="p-5 border-b border-slate-200 flex justify-between items-center">
                <h3 class="text-lg font-bold text-slate-800" id="modalTambahSoalTitle">Tambah Soal</h3>
                <button onclick="tutupModal('modalTambahSoal')" class="text-slate-400 hover:text-red-500"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="formTambahSoal" class="p-5 space-y-4">
                <input type="hidden" id="soal_id_ujian">
                <input type="hidden" id="soal_id_soal_edit">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Pertanyaan</label>
                    <textarea id="soal_pertanyaan" class="w-full border rounded-lg p-2 text-sm h-20" required></textarea>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Opsi A</label>
                    <input id="soal_opsi_a" type="text" class="w-full border rounded-lg p-2 text-sm" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Opsi B</label>
                    <input id="soal_opsi_b" type="text" class="w-full border rounded-lg p-2 text-sm" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Opsi C</label>
                    <input id="soal_opsi_c" type="text" class="w-full border rounded-lg p-2 text-sm" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Opsi D</label>
                    <input id="soal_opsi_d" type="text" class="w-full border rounded-lg p-2 text-sm" required>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Jawaban Benar</label>
                        <select id="soal_jawaban_benar" class="w-full border rounded-lg p-2 text-sm">
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Bobot</label>
                        <input id="soal_bobot" type="number" class="w-full border rounded-lg p-2 text-sm" value="5" required>
                    </div>
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-lg">Simpan Soal</button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/config.js"></script>
    <script src="../js/dosen-load-components.js"></script>
    <script src="../js/dosen-ujian.js"></script>
</body>
</html>
