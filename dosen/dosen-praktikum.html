<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Praktikum - Portal Dosen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-slate-50 flex h-screen overflow-hidden">

    <!-- Sidebar Container -->
    <div id="sidebar-container" class="flex-shrink-0"></div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
        
        <!-- Header Container -->
        <div id="header-container"></div>

        <!-- Content -->
        <main class="flex-1 overflow-y-auto p-8">
            <div class="max-w-7xl mx-auto">
                
                <!-- Page Header -->
                <div class="mb-6">
                    <h1 class="text-2xl font-bold text-slate-800 mb-1">Kelola Praktikum</h1>
                    <p class="text-slate-500 text-sm">Kelola jadwal, modul, dan penilaian praktikum mahasiswa.</p>
                </div>

                <!-- Placeholder Card -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-12 text-center">
                    <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-teal-50 mb-4">
                        <i class="fa-solid fa-flask-vial text-3xl text-teal-600"></i>
                    </div>
                    <h2 class="text-xl font-bold text-slate-800 mb-2">Halaman Praktikum</h2>
                    <p class="text-slate-500 mb-6 max-w-md mx-auto">
                        Halaman ini akan berisi daftar praktikum, jadwal, dan penilaian. Silakan lengkapi sesuai kebutuhan.
                    </p>
                    <button class="bg-teal-600 hover:bg-teal-700 text-white font-semibold px-6 py-3 rounded-lg transition-colors">
                        <i class="fa-solid fa-plus mr-2"></i> Tambah Praktikum
                    </button>
                </div>

            </div>
        </main>
    </div>

    <!-- Script Loader -->
    <script src="../js/dosen-load-components.js"></script>
</body>
</html>
