<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Dosen - EduLearn</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-slate-800">

    <div id="sidebar-container"></div>

    <main class="flex-1 overflow-y-auto flex flex-col bg-slate-50">
        
        <div id="header-container"></div>

        <div class="p-8 space-y-6">
            
            <!-- Hero Banner -->
            <div class="bg-gradient-to-r from-teal-50 to-cyan-50 rounded-2xl p-8 flex justify-between items-center shadow-sm relative overflow-hidden">
                <div class="relative z-10">
                    <h2 class="text-2xl font-bold text-slate-800 mb-2">
                        Selamat Datang, <span id="bannerDosenName" class="text-teal-700">Dosen</span>! 👨‍🏫
                    </h2>
                    <p class="text-sm text-slate-600">Kelola materi, nilai, dan pantau aktivitas belajar mahasiswa hari ini.</p>
                </div>
                <div class="hidden md:flex absolute right-10 top-0 h-full items-center text-teal-200 opacity-40 text-7xl">
                    <i class="fa-solid fa-chalkboard"></i>
                </div>
            </div>

            <!-- Stat Cards -->
            <div id="statCards" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <!-- Loading skeleton -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 animate-pulse">
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 rounded-full bg-slate-200"></div>
                        <div class="flex-1">
                            <div class="h-6 bg-slate-200 rounded w-12 mb-2"></div>
                            <div class="h-3 bg-slate-200 rounded w-20"></div>
                        </div>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 animate-pulse">
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 rounded-full bg-slate-200"></div>
                        <div class="flex-1">
                            <div class="h-6 bg-slate-200 rounded w-12 mb-2"></div>
                            <div class="h-3 bg-slate-200 rounded w-20"></div>
                        </div>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 animate-pulse">
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 rounded-full bg-slate-200"></div>
                        <div class="flex-1">
                            <div class="h-6 bg-slate-200 rounded w-12 mb-2"></div>
                            <div class="h-3 bg-slate-200 rounded w-20"></div>
                        </div>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 animate-pulse">
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 rounded-full bg-slate-200"></div>
                        <div class="flex-1">
                            <div class="h-6 bg-slate-200 rounded w-12 mb-2"></div>
                            <div class="h-3 bg-slate-200 rounded w-20"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Grid: Jadwal + Tugas Baru -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                
                <!-- Jadwal Mengajar Hari Ini -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
                    <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                        <h3 class="text-base font-bold text-slate-800 flex items-center">
                            <i class="fa-regular fa-calendar-days text-teal-600 mr-2"></i>
                            <span id="titleHariIni">Jadwal Mengajar Hari Ini</span>
                        </h3>
                        <a href="dosen-matakuliah.html" class="text-xs font-bold text-teal-600 hover:underline">
                            Lihat Semua <i class="fa-solid fa-arrow-right ml-0.5"></i>
                        </a>
                    </div>
                    <div id="jadwalHariIni" class="space-y-3 max-h-[400px] overflow-y-auto">
                        <div class="text-center py-8 text-slate-400">
                            <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-2 block"></i>
                            <p class="text-sm">Memuat jadwal...</p>
                        </div>
                    </div>
                </div>

                <!-- Tugas Baru Dikumpulkan -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
                    <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                        <h3 class="text-base font-bold text-slate-800 flex items-center">
                            <i class="fa-solid fa-list-check text-sky-600 mr-2"></i>
                            Tugas Baru Dikumpulkan
                        </h3>
                        <a href="dosen-tugas.html" class="text-xs font-bold text-sky-600 hover:underline">
                            Lihat Semua <i class="fa-solid fa-arrow-right ml-0.5"></i>
                        </a>
                    </div>
                    <div id="tugasBaru" class="space-y-3 max-h-[400px] overflow-y-auto">
                        <div class="text-center py-8 text-slate-400">
                            <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-2 block"></i>
                            <p class="text-sm">Memuat tugas...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Ujian Akan Datang -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
                <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                    <h3 class="text-base font-bold text-slate-800 flex items-center">
                        <i class="fa-regular fa-file-lines text-rose-600 mr-2"></i>
                        Ujian Akan Datang
                    </h3>
                    <a href="dosen-ujian.html" class="text-xs font-bold text-rose-600 hover:underline">
                        Lihat Semua <i class="fa-solid fa-arrow-right ml-0.5"></i>
                    </a>
                </div>
                <div id="ujianTerdekat" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div class="text-center py-8 text-slate-400 col-span-full">
                        <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-2 block"></i>
                        <p class="text-sm">Memuat ujian...</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="../js/config.js"></script>
    <script src="../js/dosen-load-components.js"></script>
    <script src="../js/dosen-dashboard.js"></script>
</body>
</html>
