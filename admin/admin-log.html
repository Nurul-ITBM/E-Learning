<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Aktivitas - EduLearn Admin</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-slate-800">

    <div id="sidebar-container"></div>

    <main class="flex-1 overflow-y-auto flex flex-col bg-slate-50">
        
        <div id="header-container"></div>

        <div class="p-4 md:p-8 space-y-6">
            
            <!-- Header Title -->
            <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-6 border-b border-slate-200 pb-4 gap-3">
                <div>
                    <h2 class="text-2xl font-bold text-slate-800">Log Aktivitas</h2>
                    <p class="text-sm text-slate-500 mt-1">Pantau semua aktivitas pengguna sistem.</p>
                </div>
                <button id="btnRefresh" class="bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 px-4 py-2.5 rounded-lg shadow-sm font-semibold text-sm transition flex items-center gap-2">
                    <i class="fa-solid fa-rotate"></i> Refresh
                </button>
            </div>

            <!-- Info Cards -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-full bg-orange-50 text-orange-600 flex items-center justify-center">
                            <i class="fa-solid fa-list-check"></i>
                        </div>
                        <div>
                            <h3 class="text-xl font-bold text-slate-800" id="statTotal">0</h3>
                            <p class="text-[10px] text-slate-500 font-medium">Total Log</p>
                        </div>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center">
                            <i class="fa-solid fa-right-to-bracket"></i>
                        </div>
                        <div>
                            <h3 class="text-xl font-bold text-slate-800" id="statLogin">0</h3>
                            <p class="text-[10px] text-slate-500 font-medium">Login</p>
                        </div>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center">
                            <i class="fa-solid fa-user-check"></i>
                        </div>
                        <div>
                            <h3 class="text-xl font-bold text-slate-800" id="statVerifikasi">0</h3>
                            <p class="text-[10px] text-slate-500 font-medium">Verifikasi</p>
                        </div>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-full bg-purple-50 text-purple-600 flex items-center justify-center">
                            <i class="fa-solid fa-database"></i>
                        </div>
                        <div>
                            <h3 class="text-xl font-bold text-slate-800" id="statBackup">0</h3>
                            <p class="text-[10px] text-slate-500 font-medium">Backup</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Filter & Search -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4">
                <div class="flex flex-col md:flex-row gap-3">
                    <div class="flex-1">
                        <div class="relative">
                            <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input type="text" id="searchInput" placeholder="Cari user, aksi, atau detail..." 
                                class="w-full pl-10 pr-4 py-2.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-orange-500 focus:border-orange-500">
                        </div>
                    </div>
                    <select id="filterAksi" class="border border-slate-200 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-orange-500">
                        <option value="">Semua Aksi</option>
                        <option value="Login">Login</option>
                        <option value="Verifikasi User">Verifikasi User</option>
                        <option value="Tolak User">Tolak User</option>
                        <option value="Update User">Update User</option>
                        <option value="Hapus User">Hapus User</option>
                        <option value="Reset Password">Reset Password</option>
                        <option value="Backup Database">Backup Database</option>
                    </select>
                </div>
            </div>

            <!-- Tabel Log -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                <div id="containerTabel" class="overflow-x-auto">
                    <div class="text-center py-12 text-slate-400">
                        <i class="fa-solid fa-circle-notch fa-spin text-4xl mb-3 block"></i>
                        <p class="text-sm">Memuat log aktivitas...</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Scripts -->
    <script src="../js/config.js"></script>
    <script src="../js/admin-layout.js"></script>
    <script src="../js/admin-log.js"></script>
</body>
</html>
