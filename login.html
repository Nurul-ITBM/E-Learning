<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EduLearn E-Learning</title>
    
    <!-- Tailwind CSS & Font Awesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Kustom Buatan Kita -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Library Kriptografi untuk Hash Password -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    
    <style>
        /* ==========================================
           BACKGROUND SEAMLESS - ANIMATED GRADIENT BLOBS
           ========================================== */
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #eef2ff;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* Container blob */
        .blob-container {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        /* Blob dasar */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.55;
            will-change: transform;
        }

        /* Blob 1 - Indigo */
        .blob-1 {
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, #818cf8 0%, #6366f1 100%);
            top: -150px;
            left: -150px;
            animation: blob-float-1 18s ease-in-out infinite;
        }

        /* Blob 2 - Purple */
        .blob-2 {
            width: 600px;
            height: 600px;
            background: linear-gradient(135deg, #c084fc 0%, #a855f7 100%);
            bottom: -200px;
            right: -200px;
            animation: blob-float-2 22s ease-in-out infinite;
        }

        /* Blob 3 - Cyan */
        .blob-3 {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #67e8f9 0%, #06b6d4 100%);
            top: 40%;
            left: 50%;
            animation: blob-float-3 20s ease-in-out infinite;
        }

        /* Blob 4 - Pink */
        .blob-4 {
            width: 350px;
            height: 350px;
            background: linear-gradient(135deg, #f9a8d4 0%, #ec4899 100%);
            top: 20%;
            right: 15%;
            animation: blob-float-4 25s ease-in-out infinite;
        }

        /* Animasi float tiap blob */
        @keyframes blob-float-1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33%      { transform: translate(80px, 60px) scale(1.1); }
            66%      { transform: translate(-40px, 100px) scale(0.95); }
        }
        @keyframes blob-float-2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33%      { transform: translate(-100px, -80px) scale(1.15); }
            66%      { transform: translate(60px, -40px) scale(0.9); }
        }
        @keyframes blob-float-3 {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50%      { transform: translate(-40%, -60%) scale(1.2); }
        }
        @keyframes blob-float-4 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(-80px, 80px) scale(1.1); }
        }

        /* Overlay grid halus */
        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background-image: 
                linear-gradient(rgba(99, 102, 241, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
        }

        /* Card login glassmorphism */
        .login-card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 
                0 20px 50px -10px rgba(79, 70, 229, 0.2),
                0 10px 20px -5px rgba(0, 0, 0, 0.05);
            animation: card-enter 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes card-enter {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ==========================================
           TOMBOL KEMBALI KE BERANDA - OPSI 5
           Futuristic dengan Border Gradient Berputar
           ========================================== */
        .btn-back-futuristic {
            position: fixed;
            top: 1.5rem;
            left: 1.5rem;
            z-index: 50;
            
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            
            padding: 0.6rem 1.2rem 0.6rem 0.8rem;
            
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 0.75rem;
            
            color: #4f46e5;
            font-weight: 600;
            font-size: 0.875rem;
            text-decoration: none;
            
            box-shadow: 
                0 4px 12px -2px rgba(79, 70, 229, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            
            transition: all 0.3s ease;
            overflow: hidden;
            isolation: isolate;
        }

        /* Border gradient animasi berputar */
        .btn-back-futuristic::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1.5px;
            background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899, #6366f1);
            background-size: 300% 300%;
            -webkit-mask: 
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.3s ease;
            animation: border-rotate 3s linear infinite;
            pointer-events: none;
            z-index: -1;
        }

        .btn-back-futuristic:hover::before {
            opacity: 1;
        }

        @keyframes border-rotate {
            0%   { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        .btn-back-futuristic:hover {
            transform: translateX(-4px);
            color: #4338ca;
            box-shadow: 
                0 8px 20px -4px rgba(99, 102, 241, 0.25),
                0 0 0 1px rgba(99, 102, 241, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        .btn-back-futuristic:active {
            transform: translateX(-2px) scale(0.98);
        }

        /* Icon container dengan rotate */
        .btn-back-futuristic .icon-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.75rem;
            height: 1.75rem;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 2px 6px -1px rgba(99, 102, 241, 0.4);
            flex-shrink: 0;
        }

        .btn-back-futuristic:hover .icon-wrap {
            transform: rotate(-360deg) scale(1.05);
        }

        /* Label text */
        .btn-back-futuristic .label {
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        /* Responsive: sembunyikan label di mobile */
        @media (max-width: 640px) {
            .btn-back-futuristic {
                top: 1rem;
                left: 1rem;
                padding: 0.5rem;
                gap: 0;
                border-radius: 9999px;
            }
            .btn-back-futuristic .label {
                display: none;
            }
            .btn-back-futuristic .icon-wrap {
                width: 1.5rem;
                height: 1.5rem;
            }
        }

        /* Accessibility: matikan animasi untuk user yang sensitif */
        @media (prefers-reduced-motion: reduce) {
            .blob,
            .login-card,
            .btn-back-futuristic::before,
            .btn-back-futuristic .icon-wrap {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- ✅ Background Blobs -->
    <div class="blob-container" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>
    
    <!-- ✅ Grid overlay halus -->
    <div class="grid-overlay" aria-hidden="true"></div>

    <!-- ✅ TOMBOL KEMBALI KE BERANDA - OPSI 5 -->
    <a href="index.html" class="btn-back-futuristic" aria-label="Kembali ke Beranda">
        <span class="icon-wrap">
            <i class="fa-solid fa-arrow-left text-xs"></i>
        </span>
        <span class="label">Kembali ke Beranda</span>
    </a>

    <!-- Card Login -->
    <div class="login-card p-10 rounded-2xl w-full max-w-md">
        
        <!-- Header & Logo -->
        <div class="flex flex-col items-center mb-8">
            <div class="bg-gradient-to-br from-indigo-500 to-purple-600 p-3 rounded-xl text-white mb-4 shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-graduation-cap text-3xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800 tracking-wide">EduLearn</h1>
            <p class="text-gray-500 text-sm mt-1">Sistem Pembelajaran Terintegrasi</p>
        </div>

        <form id="loginForm">
            <!-- Input Username -->
            <div class="mb-5">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Username / Email</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-regular fa-user text-gray-400"></i>
                    </div>
                    <input type="text" id="username" placeholder="Masukkan NIM atau NIP" 
                        class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors bg-white/70 focus:bg-white" required>
                </div>
            </div>
            
            <!-- Input Password -->
            <div class="mb-6">
                <div class="flex justify-between mb-2">
                    <label class="block text-sm font-semibold text-gray-700">Password</label>
                    <a href="#" class="text-xs text-indigo-600 hover:underline font-medium">Lupa password?</a>
                </div>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i class="fa-solid fa-lock text-gray-400"></i>
                    </div>
                    <input type="password" id="password" placeholder="••••••••" 
                        class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors bg-white/70 focus:bg-white" required>
                    <button type="button" onclick="togglePassword()" 
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-indigo-600 p-1">
                        <i class="fa-solid fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
            </div>

            <!-- Tombol Login -->
            <button type="submit" id="loginBtn" 
                class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 active:from-indigo-800 active:to-purple-800 text-white font-bold py-3 px-4 rounded-lg shadow-lg shadow-indigo-500/30 hover:shadow-indigo-500/50 transition-all flex justify-center items-center space-x-2 cursor-pointer">
                <span>Masuk ke Dashboard</span>
                <i class="fa-solid fa-arrow-right text-sm"></i>
            </button>
            
            <!-- Pesan Notifikasi -->
            <div id="statusMessage" class="mt-4 text-center text-sm hidden p-2 rounded-lg"></div>

            <!-- ✅ Link ke Registrasi -->
            <div class="mt-6 text-center text-sm text-gray-600">
                Belum punya akun? 
                <a href="register.html" class="text-indigo-600 hover:underline font-bold">Daftar di sini</a>
            </div>
        </form>
    </div>

    <!-- Script -->
    <script src="js/config.js"></script>
    <script>
        // ==========================================
        // TOGGLE PASSWORD VISIBILITY
        // ==========================================
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // ==========================================
        // SUBMIT FORM LOGIN
        // ==========================================
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('loginBtn');
            const originalText = btn.innerHTML;
            const statusMsg = document.getElementById('statusMessage');
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            // Validasi
            if (!username || !password) {
                statusMsg.className = 'mt-4 text-center text-sm p-3 rounded-lg bg-red-50 text-red-600 border border-red-200';
                statusMsg.innerText = '⚠️ Username dan password wajib diisi!';
                statusMsg.classList.remove('hidden');
                return;
            }
            
            // Loading
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Memproses...';
            btn.disabled = true;
            statusMsg.classList.add('hidden');
            
            try {
                // Hash password dengan SHA-256 (sesuai backend)
                const passwordHash = CryptoJS.SHA256(password).toString();
                
                const response = await fetch(CONFIG.API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'login',
                        username: username,
                        password: passwordHash
                    })
                });
                
                const result = await response.json();
                console.log(">>> Response login:", result);
                
                if (result.status === 'success') {
                    // ✅ SUKSES
                    statusMsg.className = 'mt-4 text-center text-sm p-3 rounded-lg bg-green-50 text-green-600 border border-green-200';
                    statusMsg.innerHTML = '<i class="fa-solid fa-check-circle mr-1"></i> Login berhasil! Mengalihkan...';
                    statusMsg.classList.remove('hidden');
                    
                    // Simpan data user
                    localStorage.setItem('user', JSON.stringify(result.data));
                    localStorage.setItem('isLoggedIn', 'true');
                    
                    // Redirect berdasarkan role
                    setTimeout(() => {
                        const role = result.data.role;
                        if (role === 'admin') {
                            window.location.href = 'admin/dashboard.html';
                        } else if (role === 'dosen') {
                            window.location.href = 'dosen/dashboard.html';
                        } else if (role === 'mahasiswa') {
                            window.location.href = 'mahasiswa/dashboard.html';
                        } else {
                            window.location.href = 'index.html';
                        }
                    }, 800);
                    
                } else {
                    // ❌ GAGAL
                    statusMsg.className = 'mt-4 text-center text-sm p-3 rounded-lg bg-red-50 text-red-600 border border-red-200';
                    statusMsg.innerHTML = '❌ ' + result.message;
                    statusMsg.classList.remove('hidden');
                    
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
                
            } catch (error) {
                console.error("Error login:", error);
                statusMsg.className = 'mt-4 text-center text-sm p-3 rounded-lg bg-red-50 text-red-600 border border-red-200';
                statusMsg.innerText = '❌ Terjadi kesalahan koneksi. Silakan coba lagi.';
                statusMsg.classList.remove('hidden');
                
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
